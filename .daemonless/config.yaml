# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

icon: ':material-note-text:'

build:
  architectures:
    - amd64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true

cit:
  mode: screenshot
  port: 5230
  health: /healthz
  screenshot: /
  screenshot_wait: 5
  ready: "started successfully!"
